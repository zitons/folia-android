name: Build iOS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Build and sync iOS web assets
        env:
          VITE_IOS_NATIVE_SOURCES: ${{ vars.IOS_NATIVE_SOURCES }}
          VITE_NETEASE_API_BASE: ${{ vars.IOS_NETEASE_API_BASE || 'https://api-enhanced-eosin-one.vercel.app' }}
          VITE_KUGOU_API_BASE: ${{ vars.IOS_KUGOU_API_BASE }}
          VITE_QQ_API_BASE: ${{ vars.IOS_QQ_API_BASE }}
          VITE_IOS_LYRIC_PROXY_BASE: ${{ vars.IOS_LYRIC_PROXY_BASE }}
        run: npm run cap:sync:ios
      - name: Build and package unsigned IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -derivedDataPath "$RUNNER_TEMP/folia-derived" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/folia-derived/Build/Products/Release-iphoneos/App.app"
          test -x "$app/App"
          test -s "$app/public/index.html"
          payload="$RUNNER_TEMP/folia-ipa/Payload"
          mkdir -p "$payload"
          ditto "$app" "$payload/App.app"
          ditto -c -k --keepParent "$payload" "$RUNNER_TEMP/Folia-iOS-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Folia-iOS-unsigned
          path: ${{ runner.temp }}/Folia-iOS-unsigned.ipa
          if-no-files-found: error
          overwrite: true

  release:
    if: github.repository == 'zitons/folia-android' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Folia-iOS-unsigned
      - name: Publish unsigned IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Folia-iOS-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Folia iOS Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Unsigned iPhone IPA built from ${GITHUB_SHA}. Signing is required for installation on standard iPhones."
