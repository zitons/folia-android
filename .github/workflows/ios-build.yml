name: Build iOS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read app version
        id: version
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Build and sync iOS web assets
        env:
          VITE_IOS_NATIVE_SOURCES: ${{ vars.IOS_NATIVE_SOURCES }}
          VITE_NETEASE_API_BASE: ${{ vars.IOS_NETEASE_API_BASE || 'https://api-enhanced-eosin-one.vercel.app' }}
          VITE_KUGOU_API_BASE: ${{ vars.IOS_KUGOU_API_BASE }}
          VITE_QQ_API_BASE: ${{ vars.IOS_QQ_API_BASE }}
          VITE_IOS_LYRIC_PROXY_BASE: ${{ vars.IOS_LYRIC_PROXY_BASE }}
        run: npm run cap:sync:ios
      - name: Build and package unsigned IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -derivedDataPath "$RUNNER_TEMP/folia-derived" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/folia-derived/Build/Products/Release-iphoneos/App.app"
          test -x "$app/App"
          test -s "$app/public/index.html"
          payload="$RUNNER_TEMP/folia-ipa/Payload"
          mkdir -p "$payload"
          ditto "$app" "$payload/App.app"
          ditto -c -k --keepParent "$payload" "$RUNNER_TEMP/Folia-iOS-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Folia-iOS-unsigned
          path: ${{ runner.temp }}/Folia-iOS-unsigned.ipa
          if-no-files-found: error
          overwrite: true

  release:
    if: github.repository == 'zitons/folia-android' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ios-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Folia-iOS-unsigned
      - name: Publish unsigned IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="ios-v${APP_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            test "$published_sha" = "$GITHUB_SHA"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq 'any(.assets[]; .name == "Folia-iOS-unsigned.ipa")' | grep -qx true; then
              gh release upload "$tag" Folia-iOS-unsigned.ipa --repo "$GITHUB_REPOSITORY"
            fi
            exit
          fi
          latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName' | sed -n '/^ios-v/p' | sort -V | tail -n 1)
          latest=true
          if [[ -n "$latest_tag" && "$(printf '%s\n' "$tag" "$latest_tag" | sort -V | tail -n 1)" != "$tag" ]]; then
            latest=false
          fi
          gh release create "$tag" Folia-iOS-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest="$latest" \
            --title "Folia iOS ${APP_VERSION}" \
            --notes "Unsigned iPhone IPA built from ${GITHUB_SHA}. Signing is required for installation on standard iPhones."
